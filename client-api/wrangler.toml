name = "lf-client-api"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Runs on a Worker ROUTE on the live domain (so the Cloudflare Access cookie is
# same-origin and no CORS is needed). Configure the route in the dashboard or
# via REST — see the runbook. Documented here for reference:
#   www.lfadvisory.com.au/client-api/*
#   lfadvisory.com.au/client-api/*
# (Workers routes take precedence over Pages for matching paths.)

[vars]
SP_HOSTNAME = "lfadvisoryptyltd.sharepoint.com"
# Live value = "LF Advisory Workpapers" (the folder the other tools already use, so
# no new folder was needed). Client files land there as flux-loan-tracker.json etc.
# TODO(optional tidy): create a dedicated "Client Portal Data" folder in that same
# document library and switch this back for separation from staff workpapers.
FOLDER      = "LF Advisory Workpapers"
TENANT_ID   = "f869ffc9-81fa-4bbf-94ec-a9bd5ca6b3a3"
CLIENT_ID   = "981d2ee1-a2a9-4787-8972-b349938ba7ab"   # same Azure app as the mailer (needs Sites.ReadWrite.All app perm)

# Cloudflare Access (from the Zero Trust setup, 2026-08-17):
ACCESS_TEAM = "bold-resonance-322f"   # team domain: bold-resonance-322f.cloudflareaccess.com
ACCESS_AUD  = "e40d5b73a514c5ce78fd6f3347b84cbb36eedba3ea8110d3fec7eaf40d9a1d6e"   # "LF Advisory Client Portal" app AUD

# Client registry — one entry per client email (lower-case keys).
# clientId scopes the data file (<clientId>-<app>.json); apps = what they can open.
REGISTRY = '{"samantha@fluxproperty.com.au":{"client":"Flux Property Group","clientId":"flux","apps":["loan-tracker"]},"liam@fluxproperty.com.au":{"client":"Flux Property Group","clientId":"flux","apps":["loan-tracker"]}}'

# Secret (set via REST secret_text binding, NOT here):
#   CLIENT_SECRET = Azure app client secret (same value the mailer uses)
